<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de IRPF de autónomos por comunidad autónoma</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5f8b'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%82%AC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../estilos.css?v=3079c0fe58">
</head>
<body class="widget">
<main>
<div class="contenedor">
  <div class="calculadora apilada">
  <form id="formulario" class="tarjeta" novalidate>
    <h2>Tus datos del año</h2>
    <div class="rejilla">
      <div>
        <label for="comunidad">Comunidad autónoma<span class="ayuda">Donde vives. No incluye País Vasco, Navarra, Ceuta ni Melilla.</span></label>
        <select id="comunidad" name="comunidad">
          <option value="andalucia">Andalucía</option>
          <option value="aragon">Aragón</option>
          <option value="canarias">Canarias</option>
          <option value="cantabria">Cantabria</option>
          <option value="castilla_y_leon">Castilla y León</option>
          <option value="castilla_la_mancha">Castilla-La Mancha</option>
          <option value="cataluna">Cataluña</option>
          <option value="madrid" selected>Comunidad de Madrid</option>
          <option value="valenciana">Comunitat Valenciana</option>
          <option value="extremadura">Extremadura</option>
          <option value="galicia">Galicia</option>
          <option value="baleares">Illes Balears</option>
          <option value="la_rioja">La Rioja</option>
          <option value="asturias">Principado de Asturias</option>
          <option value="murcia">Región de Murcia</option>
        </select>
      </div>
      <div>
        <label for="anio">Ejercicio<span class="ayuda">El año que quieres calcular.</span></label>
        <select id="anio" name="anio">
          <option value="2026" selected>2026</option>
          <option value="2025">2025</option>
        </select>
      </div>
      <div>
        <label for="ingresos">Ingresos anuales (€)<span class="ayuda" id="ayuda-ingresos">Lo facturado en el año, sin IVA.</span></label>
        <input id="ingresos" name="ingresos" type="number" inputmode="decimal" min="0" step="0.01" value="40000">
      </div>
      <div>
        <label for="gastos">Gastos deducibles (€)<span class="ayuda" id="ayuda-gastos">Sin contar las cuotas de autónomo.</span></label>
        <input id="gastos" name="gastos" type="number" inputmode="decimal" min="0" step="0.01" value="5000">
      </div>
      <div>
        <label for="cuotas">Cuotas de autónomo pagadas (€)<span class="ayuda" id="ayuda-cuotas">Total del año a la Seguridad Social.</span></label>
        <input id="cuotas" name="cuotas" type="number" inputmode="decimal" min="0" step="0.01" value="4000">
      </div>
      <div>
        <label for="pagos">Retenciones y pagos a cuenta (€)<span class="ayuda" id="ayuda-pagos">Lo ya adelantado a Hacienda en el año.</span></label>
        <input id="pagos" name="pagos" type="number" inputmode="decimal" min="0" step="0.01" value="0">
      </div>
      <div>
        <label for="modalidad">Estimación<span class="ayuda">La que usas en el IRPF. La más habitual es la simplificada.</span></label>
        <select id="modalidad" name="modalidad">
          <option value="directa_simplificada" selected>Directa simplificada</option>
          <option value="directa_normal">Directa normal</option>
        </select>
      </div>
    </div>
    <div class="casilla">
      <input id="inicio" name="inicio" type="checkbox">
      <label for="inicio">Acabo de empezar como autónomo<span class="ayuda">Reducción del 20 % del IRPF (art. 32.3 de la Ley del IRPF). Márcala solo si no tuviste actividad económica el año anterior al inicio, es tu primer o segundo año con beneficios y no facturas más del 50 % a quien te pagó como asalariado ese año anterior.</span></label>
    </div>
    <div class="casilla">
      <input id="cliente" name="cliente" type="checkbox">
      <label for="cliente">Cumplo los requisitos de la reducción para autónomos dependientes<span class="ayuda">Art. 32.2.2.º de la Ley del IRPF: entre otros, un único cliente no vinculado y gastos que no superen el 30 % de los ingresos.</span></label>
    </div>
    <details>
      <summary>Hijos y otros descendientes</summary>
      <div class="rejilla" style="margin-top:12px">
      <div>
        <label for="hijos">Descendientes que dan derecho al mínimo<span class="ayuda" id="ayuda-hijos">En general, menores de 25 años que viven contigo.</span></label>
        <input id="hijos" name="hijos" type="number" inputmode="decimal" min="0" step="0.01" value="0" step="1" max="20">
      </div>
      <div>
        <label for="menores3">De ellos, menores de 3 años<span class="ayuda" id="ayuda-menores3">Cuéntalos también en la casilla anterior.</span></label>
        <input id="menores3" name="menores3" type="number" inputmode="decimal" min="0" step="0.01" value="0" step="1" max="20">
      </div>
      </div>
      <div class="casilla">
        <input id="compartido" name="compartido" type="checkbox">
        <label for="compartido">El otro progenitor también aplica el mínimo<span class="ayuda">En ese caso se reparte a partes iguales.</span></label>
      </div>
    </details>
  </form>

  <section class="tarjeta resultado" aria-live="polite">
    <h2>Resultado</h2>
    <div id="resultado"><p>Rellena tus datos para ver el cálculo.</p></div>
  </section>
  </div>
  <p class="widget-pie">Calculadora: <a href="https://juli2006farres.github.io/calculadora-irpf-autonomos-cataluna/calculadora-irpf-autonomos/" target="_blank" rel="noopener">IRPF por comunidad autónoma · Calculadoras para autónomos</a>. Datos oficiales de 2026. Estimación orientativa.</p>
</div>
</main>
<script type="module" src="../../irpf-espana-app.js"></script>
<script type="module" src="../../widget.js"></script>
</body>
</html>
